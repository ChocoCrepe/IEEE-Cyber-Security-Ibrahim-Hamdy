<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body>
<!-- Go To External Link -->
<a href="https://google.com">Google</a>

<!-- Open The link In a New Tab -->
<a href="https://google.com" target="_blank">Google</a>

<!-- Go To a Link Within The Same Website-->
<a href="images.asp">Images</a>

<!-- Use An Image As a Link-->
<!--Using Alternative Text If The Image Doesn't Load -->
<a href="default.asp">
<img src="smiley.gif" alt="Alt Text" width="42" height="42">
</a>

<!-- Link To an Email Address-->
<a href="mailto:someone@example.com">Send email</a>

<!-- Setting a Title To The Link -->
<a href="https://google.com" title="Go to Google">Google</a>

<!-- Creating a Bookmark -->
<h2 id="C4">Chapter 4</h2>
<a href="#C4">Jump to Chapter 4</a>

</body>






</html>
